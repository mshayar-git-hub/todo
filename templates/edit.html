<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Input Bar</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <h3>Edit Task</h3>

    <form method="POST">
        {% csrf_token %}
        <div class="input-group">
            <input type="text"
                   name="task"
                   class="form-control"
                   value="{{ task.task }}">
            <button class="btn btn-primary" type="submit">
                Update
            </button>
        </div>
    </form>
</div>


</body>
</html>
